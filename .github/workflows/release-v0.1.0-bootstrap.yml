name: Release v0.1.0 bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Bootstrap mineflayer v0.1.0 GitHub release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release for existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "mineflayer v0.1.0"
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY"
